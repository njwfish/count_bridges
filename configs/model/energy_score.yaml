# Energy Score Loss Configuration
_target_: models.energy.EnergyScoreLoss

# Architecture (use MLP by default)
architecture: ${architecture}

# Energy score parameters
noise_dim: 100
m_samples: 32
lambda_energy: 1.0

# Apply randomized integer rounding to predictions at sample time.
# Set to false for continuous-data experiments (e.g. dataset.continuous=true).
round_output: true