# Inverse-Gaussian-clocked Gaussian bridge (rigorous version of the
# heuristic AdaptiveGaussianBridge). See
# cell_types/generative/counting_flows/adaptive_gaussian_bridge.tex for
# the construction.
_target_: bridges.torch.clocked_gaussian_bridge.ClockedGaussianBridge

# Per-coord Brownian scale.
sigma: 1.0
# IG-clock parameters. The note's (gamma, eta); we use `nu` for the rate
# parameter to avoid clashing with the codebase-wide `eta` knob below
# (the noise multiplier on every bridge). Defaults match the legacy
# heuristic AdaptiveGaussianBridge at u=0 with lam=1024:
#   r*(0) = nu / gamma  (= sqrt(4 lam) = 64).
gamma: 1.0
nu: 64.0
t_eps: 1.0e-3
homogeneous_time: false

# Sampler-only knobs (excluded from training-config hash via
# utils.get_model_hash).
#   mode='bridge' -- exact finite-step IG bridge given x_0_pred (correct for
#                    distributional / energy-score models).
#   mode='sde'    -- moment-matched diffusion approximation (correct for
#                    MSE / mean-regression models).
#   eta = 0       -- deterministic drift step, identical in both modes.
#   eta = 1       -- full sampler in the chosen mode.
mode: bridge
eta: 1.0

# GIG(-1) RoU sampler knobs (used in mode='bridge'):
gig_n_rounds: 12
gig_safety: 1.05
# Gauss-Legendre nodes for D_IG quadrature (mode='sde' only):
n_quad: 32
